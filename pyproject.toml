[project]
name = "corporate-kb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastmcp>=2.0",
    "authlib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "testcontainers[neo4j]>=4.8",
]
