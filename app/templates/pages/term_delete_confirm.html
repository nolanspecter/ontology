{% extends "base.html" %}
{% block content %}
<h1>Delete {{ term.name }}?</h1>
<p>{{ term.definition }}</p>
<p class="notice">This permanently deletes the term, its relations, and its full change history. This cannot be undone.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/app/terms/{{ term.name }}/delete">
  <label>Type <strong>{{ term.name }}</strong> to confirm
    <input type="text" name="confirm_name" id="confirm-name" autocomplete="off" data-expected="{{ term.name }}">
  </label>
  <button type="submit" id="delete-button" class="btn btn-danger" disabled>Delete permanently</button>
  <a href="/app/terms/{{ term.name }}">Cancel</a>
</form>
<script>
  var input = document.getElementById('confirm-name');
  var button = document.getElementById('delete-button');
  input.addEventListener('input', function () {
    button.disabled = input.value !== input.dataset.expected;
  });
</script>
{% endblock %}
