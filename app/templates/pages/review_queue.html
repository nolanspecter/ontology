{% extends "base.html" %}
{% block content %}
<h1>Review Queue</h1>
<table>
{% for item in queue %}
<tr>
  <td><a href="/app/review/{{ item.term_name }}">{{ item.term_name }}</a></td>
  <td class="badge">{{ item.kind }}</td>
  <td>
    <form method="post" action="/app/review/{{ item.term_name }}/approve" style="display:inline" hx-post="/app/review/{{ item.term_name }}/approve" hx-target="closest tr" hx-swap="outerHTML">
      <button type="submit">Approve</button>
    </form>
    <form method="post" action="/app/review/{{ item.term_name }}/reject" style="display:inline" hx-post="/app/review/{{ item.term_name }}/reject" hx-target="closest tr" hx-swap="outerHTML">
      <input type="text" name="reason" placeholder="Reason" required>
      <button type="submit">Reject</button>
    </form>
  </td>
</tr>
{% else %}
<tr><td colspan="3">No pending items yet.</td></tr>
{% endfor %}
</table>
{% endblock %}
