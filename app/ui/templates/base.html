<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ontology{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
  <nav>
    <a class="brand" href="/app/terms">Ontology</a>
    {% if current_user %}
      {% if current_user.role in ("editor", "admin") %}<a href="/app/terms/new">New Term</a>{% endif %}
      {% if current_user.role in ("reviewer", "admin") %}<a href="/app/review">Review Queue</a>{% endif %}
      <span>{{ current_user.email }} ({{ current_user.role.value }})</span>
      <form action="/auth/logout" method="post" style="display:inline"><button type="submit" class="btn-ghost">Log out</button></form>
    {% else %}
      <a href="/auth/login">Sign in</a>
    {% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
