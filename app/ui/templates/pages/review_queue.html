{% extends "base.html" %}
{% block content %}
<h1>Review Queue</h1>
<div class="board">
{% for item in queue %}
<div class="board-row">
  <div>
    <a class="board-name" href="/app/review/{{ item.term_name }}">{{ item.term_name }}</a>
    <span class="badge">{{ item.kind }}</span>
  </div>
  <div class="board-actions">
    <form method="post" action="/app/review/{{ item.term_name }}/approve" hx-post="/app/review/{{ item.term_name }}/approve" hx-target="closest .board-row" hx-swap="outerHTML swap:250ms">
      <button type="submit">Approve</button>
    </form>
    <form method="post" action="/app/review/{{ item.term_name }}/reject" hx-post="/app/review/{{ item.term_name }}/reject" hx-target="closest .board-row" hx-swap="outerHTML swap:250ms">
      <input type="text" name="reason" placeholder="Reason" required>
      <button type="submit" class="btn-danger">Reject</button>
    </form>
  </div>
</div>
{% else %}
<p class="board-empty">No pending items yet.</p>
{% endfor %}
</div>
{% endblock %}
